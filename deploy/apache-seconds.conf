# Seconds hinter Apache als Reverse Proxy unter https://inf-zeus.de/seconds/
#
# Diesen Block in den bestehenden <VirtualHost *:443> von inf-zeus.de einfügen
# (dorthin, wo die anderen Projekte auch stehen).
#
# Benötigte Module – einmalig:
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo systemctl reload apache2

# Ohne abschließenden Slash würden style.css/app.js relativ zu / aufgelöst.
RedirectMatch permanent "^/seconds$" "/seconds/"

# WebSocket-Regel MUSS vor der HTTP-Regel stehen – Apache nimmt die erste,
# die passt, nicht die spezifischste.
ProxyPass        /seconds/ws  ws://127.0.0.1:8077/ws
ProxyPassReverse /seconds/ws  ws://127.0.0.1:8077/ws

ProxyPass        /seconds/    http://127.0.0.1:8077/
ProxyPassReverse /seconds/    http://127.0.0.1:8077/
