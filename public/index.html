<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seconds – finde das gleiche Symbol</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== Start ===================== -->
<section id="view-lobby" class="view active">
  <header class="brand">
    <h1 class="logo">SECONDS</h1>
    <p class="tag">Ein gemeinsames Symbol. Wer es zuerst sieht, kriegt den Punkt.</p>
  </header>

  <div class="panel narrow">
    <label class="field">
      <span>Dein Name</span>
      <input id="nameInput" type="text" maxlength="16" placeholder="z.&nbsp;B. Alex"
             autocomplete="nickname" spellcheck="false">
    </label>

    <div class="setting">
      <span class="setting-label">Sichtbar</span>
      <div class="segmented">
        <button class="seg sel" data-vis="public">Öffentlich</button>
        <button class="seg" data-vis="private">Privat</button>
      </div>
    </div>
    <button id="createBtn" class="btn primary big">Raum eröffnen</button>

    <div class="or"><span>oder beitreten</span></div>

    <div class="rooms-head">Offene Räume <span id="roomCount"></span></div>
    <div id="roomList" class="roomlist"></div>

    <div class="joinrow">
      <input id="codeInput" maxlength="4" placeholder="CODE" autocapitalize="characters"
             autocomplete="off" spellcheck="false">
      <button id="joinBtn" class="btn">Mit Code</button>
    </div>
      <p class="zurueckzeile"><a class="zurueck" href="/spiele/">← Alle Spiele</a></p>
  </div>
</section>

<!-- ===================== Warteraum ===================== -->
<section id="view-room" class="view">
  <div class="panel wide center">
    <div class="codebox">
      <span class="codebox-label">Raumcode</span>
      <strong id="roomCode">····</strong>
      <span id="roomVis" class="codebox-vis"></span>
      <button id="copyBtn" class="btn ghost small">Link kopieren</button>
    </div>

    <h2 id="roomTitle">Raum</h2>
    <div id="playerList" class="seats"></div>

    <div class="setting">
      <span class="setting-label">Spiel geht bis</span>
      <div id="targetGroup" class="segmented">
        <button class="seg" data-v="5">5</button>
        <button class="seg sel" data-v="10">10</button>
        <button class="seg" data-v="15">15</button>
      </div>
    </div>

    <div class="row gap">
      <button id="readyBtn" class="btn big">Bereit</button>
      <button id="startBtn" class="btn primary big">Runde starten</button>
    </div>
    <p id="roomHint" class="muted small"></p>
    <button id="leaveBtn" class="btn ghost small">Raum verlassen</button>
  </div>
</section>

<!-- ===================== Spiel ===================== -->
<section id="view-game" class="view">
  <div class="topbar">
    <div id="scoreboard" class="scoreboard"></div>
    <div class="topbar-right">
      <span id="roundInfo" class="pill"></span>
      <button id="leaveBtn2" class="btn ghost small">Verlassen</button>
    </div>
  </div>

  <div class="table">
    <div class="card-slot">
      <div class="card-label">Mitte</div>
      <div id="centerCard" class="card center"></div>
    </div>
    <div class="card-slot">
      <div class="card-label">Deine Karte</div>
      <div id="playerCard" class="card mine">
        <div id="lockOverlay" class="lock-overlay"><span>Daneben!</span></div>
      </div>
    </div>
  </div>

  <div id="banner" class="banner"></div>
</section>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
